appId: com.deepseek.harness.clean
productName: DeepSeek Harness Clean
copyright: Copyright © 2026

directories:
  output: dist-clean-installer
  buildResources: assets

win:
  icon: icon.ico
  target:
    - target: nsis
      arch: [x64]

nsis:
  artifactName: DeepSeek-Harness-Clean-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
