name: Desktop test

on:
  push:
    branches: [master]
    paths:
      - apps/desktop/**
      - .github/workflows/desktop-test.yml
  pull_request:
    paths:
      - apps/desktop/**
      - .github/workflows/desktop-test.yml

permissions:
  contents: read

jobs:
  node-test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm test
