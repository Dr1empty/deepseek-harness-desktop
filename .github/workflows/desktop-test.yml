name: Desktop test

on:
  push:
    branches: [master]
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop-test.yml'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop-test.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/desktop

jobs:
  desktop-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run release:desktop
      - name: Verify NSIS Setup
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist-desktop-installer/DeepSeek-Harness-Desktop-Setup-*.exe
          if ($setup.Count -ne 1 -or $setup[0].Length -lt 100MB) {
            throw 'Desktop Setup was not built correctly.'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-Desktop-Setup
          path: |
            apps/desktop/dist-desktop-installer/*.exe
            apps/desktop/dist-desktop-installer/*.blockmap
            apps/desktop/dist-desktop-installer/latest.yml
            apps/desktop/dist-desktop-installer/SHA256SUMS.txt
            apps/desktop/dist-desktop-installer/release-manifest.json
          if-no-files-found: error
