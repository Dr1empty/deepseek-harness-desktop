name: Desktop test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  desktop-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:desktop-installer
      - name: Verify NSIS Setup
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist-desktop-installer/DeepSeek-Harness-Desktop-Setup-*.exe
          if ($setup.Count -ne 1 -or $setup[0].Length -lt 100MB) {
            throw 'Desktop Setup was not built correctly.'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-Desktop-Setup
          path: |
            dist-desktop-installer/*.exe
            dist-desktop-installer/*.blockmap
          if-no-files-found: error
