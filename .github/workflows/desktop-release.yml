name: Desktop release

on:
  push:
    tags:
      - 'v*-desktop'

permissions:
  contents: write

defaults:
  run:
    working-directory: apps/desktop

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run release:desktop
      - name: Publish Desktop Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            dist-desktop-installer/DeepSeek-Harness-Desktop-Setup-*.exe `
            dist-desktop-installer/DeepSeek-Harness-Desktop-Setup-*.exe.blockmap `
            dist-desktop-installer/latest.yml `
            dist-desktop-installer/SHA256SUMS.txt `
            dist-desktop-installer/release-manifest.json `
            --verify-tag `
            --title "DeepSeek Harness Desktop $($env:GITHUB_REF_NAME -replace '^v|-desktop$','')" `
            --generate-notes
