appId: com.deepseek.harness
productName: DeepSeek Harness
copyright: Copyright © 2026

directories:
  output: dist
  buildResources: assets

# 主进程代码 + package.json 打进 asar
files:
  - src/**/*
  - assets/**/*
  - package.json

# 便携 Node 运行时：包含 node.exe 与 npm（运行 harness，并支持应用内更新）
# 注意：harness 本体（含 pnpm junction）不走 electron-builder 的 extraResources ——
#   electron-builder 的 copyAppFiles 会对每个 junction 调 fs-extra ensureSymlink，
#   本机 Developer Mode 关闭会 EPERM。harness 由 post-build 脚本 build/copy-harness.cjs
#   以「重建 junction」的方式拷入 resources/harness，并在首次运行由 backend.js 搬迁重写。
extraResources:
  - from: vendor/node/node.exe
    to: node/node.exe
  # DSH 的 `plugin` 子命令在 Windows 上优先使用当前 node 旁边的
  # Corepack pnpm JS 入口。只带 node.exe 会让插件的一键更新报
  # “pnpm failed in profile directory”。
  - from: vendor/node/node_modules/corepack
    to: node/node_modules/corepack
  - from: vendor/node/pnpm.cmd
    to: node/pnpm.cmd
  # npm 的依赖树包含 node_modules，electron-builder 会过滤它；保留官方
  # Node 压缩包，在首次立即更新时解压到用户数据目录。
  - from: vendor/node-v24.18.0-win-x64.zip
    to: update-tools/node.zip

win:
  icon: icon.ico
  # 只产 win-unpacked 目录（不进 7z/NSIS —— 7z 解引用循环 junction 会死循环）。
  # 最终交付物是把 win-unpacked 打成 zip 的便携目录。
  target:
    - target: dir
      arch: [x64]

# 国内镜像加速
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
