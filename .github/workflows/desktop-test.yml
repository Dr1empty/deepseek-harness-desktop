name: Desktop test

on:
  push:
    branches: [master]
    paths:
      - apps/desktop/**
      - .github/workflows/desktop-test.yml
  pull_request:
    paths:
      - apps/desktop/**
      - .github/workflows/desktop-test.yml

permissions:
  contents: read

jobs:
  node-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Verify desktop package
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'apps/desktop/package-lock.json')) {
            throw 'apps/desktop/package-lock.json was not checked out'
          }
      - name: Install desktop dependencies
        run: npm ci --prefix apps/desktop
      - name: Run desktop tests
        run: npm test --prefix apps/desktop
