appId: com.deepseek.harness
productName: DeepSeek Harness
copyright: Copyright © 2026

directories:
  output: dist
  buildResources: assets

# 只把 Electron 壳打进 app.asar
files:
  - src/**/*
  - assets/**/*
  - package.json

# node 运行时打进 resources/。
# 注意：harness 不能走 extraResources——它的依赖全在顶层 node_modules 里，而
# electron-builder 会硬编码排除顶层 node_modules（见 filter.js 的 createFilter），
# 只能先用 make-dist.cjs 归零 junction，再走 --prepackaged 直接把便携文件夹打成安装包。
extraResources:
  - from: vendor/node/node.exe
    to: node/node.exe
  - from: vendor/node/node_modules/corepack
    to: node/node_modules/corepack
  - from: vendor/node/pnpm.cmd
    to: node/pnpm.cmd
  - from: vendor/node-v24.18.0-win-x64.zip
    to: update-tools/node.zip

win:
  icon: icon.ico
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

# 国内镜像加速
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
